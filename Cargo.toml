[package]
name = "shield"
version = "0.1.0"
edition = "2021"
description = "A reusable cybersecurity framework foundation for DaemonONE"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2.2"
keyring = { version = "4.2", features = ["v1"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rusqlite = { version = "0.42", features = ["bundled"] }
sha2 = "0.10"
uuid = "1"
zeroize = "1"
